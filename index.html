<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none;
        }
        #gameContainer { position: relative; display: flex; flex-direction: column; align-items: center; }
        #scoreBoard { display: flex; gap: 40px; margin-bottom: 15px; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
        .score-item { display: flex; align-items: center; gap: 8px; }
        .score-label { color: #666; font-size: 12px; }
        .score-value { color: #0f0; font-weight: bold; font-size: 24px; text-shadow: 0 0 10px #0f0; }
        #highScore .score-value { color: #ff0; text-shadow: 0 0 10px #ff0; }
        canvas { border: 2px solid #333; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 255, 0, 0.1); }
        #controls { margin-top: 15px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        button {
            background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 25px;
            border-radius: 25px; cursor: pointer; font-size: 14px; text-transform: uppercase;
            letter-spacing: 1px; transition: all 0.3s ease;
        }
        button:hover { background: #252525; border-color: #0f0; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3); }
        button:active { transform: scale(0.95); }
        .mode-btn { opacity: 0.5; }
        .mode-btn.active { opacity: 1; border-color: #0f0; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2); }
        #startScreen, #gameOverScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.9); z-index: 10; border-radius: 8px;
        }
        #startScreen h1 { font-size: 48px; margin-bottom: 10px; text-shadow: 0 0 20px #0f0; letter-spacing: 5px; }
        #startScreen p, #gameOverScreen p { color: #888; margin-bottom: 30px; text-align: center; }
        #gameOverScreen h2 { font-size: 36px; color: #f00; text-shadow: 0 0 20px #f00; margin-bottom: 15px; }
        .hidden { display: none !important; }
        #mobileControls { display: none; margin-top: 20px; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }
        .d-pad button { width: 60px; height: 60px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 12px; }
        @media (max-width: 600px) {
            #mobileControls { display: block; }
            #scoreBoard { gap: 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="scoreBoard">
            <div class="score-item"><span class="score-label">Score</span><span class="score-value" id="score">0</span></div>
            <div class="score-item" id="highScore"><span class="score-label">Best</span><span class="score-value" id="best">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="startScreen">
            <h1>NEON SNAKE</h1>
            <p>Use Arrow Keys or WASD to move<br>Collect food to grow and score<br><br>Press Space to pause</p>
            <button onclick="startGame()">Start Game</button>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="startGame()">Play Again</button>
        </div>
        <div id="controls">
            <button class="mode-btn active" onclick="setMode('classic')">Classic</button>
            <button class="mode-btn" onclick="setMode('speed')">Speed</button>
            <button class="mode-btn" onclick="setMode('noWalls')">No Walls</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 20;
        let TILE_COUNT = 20;
        let CANVAS_SIZE = GRID_SIZE * TILE_COUNT;
        let snake = [], food = {}, dx = 0, dy = 0, nextDx = 0, nextDy = 0;
        let score = 0, highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameLoop = null, gameSpeed = 100, baseSpeed = 100, particles = [];
        let gameMode = 'classic', isGameOver = false, isPaused = false;
        const COLORS = { snakeHead: '#0f0', snakeBody: '#0a0', food: '#f00', foodGlow: '#f44', grid: '#1a1a1a', background: '#0a0a0a' };

        function init() { updateCanvasSize(); document.getElementById('best').textContent = highScore; window.addEventListener('resize', updateCanvasSize); }
        function updateCanvasSize() { const maxSize = Math.min(window.innerWidth - 40, 600); CANVAS_SIZE = Math.floor(maxSize / GRID_SIZE) * GRID_SIZE; TILE_COUNT = CANVAS_SIZE / GRID_SIZE; canvas.width = CANVAS_SIZE; canvas.height = CANVAS_SIZE; }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(frequency, duration, type) {
            try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = frequency; o.type = type || 'sine'; g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration); o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + duration); } catch(e) {}
        }
        function playEatSound() { playSound(600, 0.1); setTimeout(() => playSound(800, 0.15), 50); }
        function playDieSound() { playSound(200, 0.3, 'sawtooth'); setTimeout(() => playSound(150, 0.3, 'sawtooth'), 100); }

        class Particle { constructor(x, y, color) { this.x = x; this.y = y; this.color = color; this.vx = (Math.random() - 0.5) * 4; this.vy = (Math.random() - 0.5) * 4; this.life = 1; this.decay = 0.02 + Math.random() * 0.03; this.size = Math.random() * 4 + 2; }
            update() { this.x += this.vx; this.y += this.vy; this.vx *= 0.98; this.vy *= 0.98; this.life -= this.decay; this.size *= 0.98; }
            draw(ctx) { ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }
        function createExplosion(x, y, color) { for (let i = 0; i < 15; i++) particles.push(new Particle(x, y, color)); }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            snake = [{ x: Math.floor(TILE_COUNT / 2), y: Math.floor(TILE_COUNT / 2) }];
            dx = 1; dy = 0; nextDx = 1; nextDy = 0; score = 0; particles = []; isGameOver = false; isPaused = false;
            updateScore(); placeFood(); if (gameLoop) clearInterval(gameLoop); gameSpeed = baseSpeed; gameLoop = setInterval(update, gameSpeed); requestAnimationFrame(render);
        }
        function update() {
            if (isGameOver || isPaused) return;
            dx = nextDx; dy = nextDy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            if (gameMode === 'noWalls') { if (head.x < 0) head.x = TILE_COUNT - 1; if (head.x >= TILE_COUNT) head.x = 0; if (head.y < 0) head.y = TILE_COUNT - 1; if (head.y >= TILE_COUNT) head.y = 0; }
            else { if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) { gameOver(); return; } }
            for (let i = 0; i < snake.length - 1; i++) { if (head.x === snake[i].x && head.y === snake[i].y) { gameOver(); return; } }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10; if (score > highScore) { highScore = score; localStorage.setItem('snakeHighScore', highScore); }
                updateScore(); playEatSound(); createExplosion(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, COLORS.food); placeFood();
                if (gameMode === 'speed') { gameSpeed = Math.max(40, baseSpeed - score); clearInterval(gameLoop); gameLoop = setInterval(update, gameSpeed); }
            } else { snake.pop(); }
        }
        function placeFood() { do { food = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) }; } while (snake.some(s => s.x === food.x && s.y === food.y)); }
        function gameOver() { isGameOver = true; clearInterval(gameLoop); playDieSound(); document.getElementById('finalScore').textContent = score; document.getElementById('gameOverScreen').classList.remove('hidden'); }
        function updateScore() { document.getElementById('score').textContent = score; document.getElementById('best').textContent = highScore; }

        function render() {
            ctx.fillStyle = COLORS.background; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = COLORS.grid; ctx.lineWidth = 0.5;
            for (let i = 0; i <= TILE_COUNT; i++) { ctx.beginPath(); ctx.moveTo(i * GRID_SIZE, 0); ctx.lineTo(i * GRID_SIZE, CANVAS_SIZE); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * GRID_SIZE); ctx.lineTo(CANVAS_SIZE, i * GRID_SIZE); ctx.stroke(); }
            const foodX = food.x * GRID_SIZE + GRID_SIZE / 2, foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
            ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = COLORS.foodGlow; ctx.fillStyle = COLORS.food; ctx.beginPath(); ctx.arc(foodX, foodY, GRID_SIZE / 2 - 2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            snake.forEach((segment, index) => {
                const x = segment.x * GRID_SIZE, y = segment.y * GRID_SIZE, isHead = index === 0;
                ctx.save();
                if (isHead) { ctx.shadowBlur = 15; ctx.shadowColor = COLORS.snakeHead; ctx.fillStyle = COLORS.snakeHead; }
                else { const gradient = ctx.createRadialGradient(x + GRID_SIZE / 2, y + GRID_SIZE / 2, 0, x + GRID_SIZE / 2, y + GRID_SIZE / 2, GRID_SIZE / 2); gradient.addColorStop(0, COLORS.snakeHead); gradient.addColorStop(1, COLORS.snakeBody); ctx.fillStyle = gradient; }
                const padding = isHead ? 1 : 2; ctx.fillRect(x + padding, y + padding, GRID_SIZE - padding * 2, GRID_SIZE - padding * 2);
                if (isHead) { ctx.fillStyle = '#000'; const eyeSize = 3;
                    if (dx === 1) { ctx.beginPath(); ctx.arc(x + 14, y + 6, eyeSize, 0, Math.PI * 2); ctx.arc(x + 14, y + 14, eyeSize, 0, Math.PI * 2); ctx.fill(); }
                    else if (dx === -1) { ctx.beginPath(); ctx.arc(x + 6, y + 6, eyeSize, 0, Math.PI * 2); ctx.arc(x + 6, y + 14, eyeSize, 0, Math.PI * 2); ctx.fill(); }
                    else if (dy === -1) { ctx.beginPath(); ctx.arc(x + 6, y + 6, eyeSize, 0, Math.PI * 2); ctx.arc(x + 14, y + 6, eyeSize, 0, Math.PI * 2); ctx.fill(); }
                    else { ctx.beginPath(); ctx.arc(x + 6, y + 14, eyeSize, 0, Math.PI * 2); ctx.arc(x + 14, y + 14, eyeSize, 0, Math.PI * 2); ctx.fill(); }
                }
                ctx.restore();
            });
            particles = particles.filter(p => p.life > 0); particles.forEach(p => { p.update(); p.draw(ctx); });
            requestAnimationFrame(render);
        }

        function setDirection(newDx, newDy) { if (isGameOver) return; if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return; nextDx = newDx; nextDy = newDy; }
        function setMode(mode) { gameMode = mode; document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); }

        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            switch(e.key) { case 'ArrowUp': case 'w': case 'W': e.preventDefault(); if (dy !== 1) { nextDx = 0; nextDy = -1; } break; case 'ArrowDown': case 's': case 'S': e.preventDefault(); if (dy !== -1) { nextDx = 0; nextDy = 1; } break; case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); if (dx !== 1) { nextDx = -1; nextDy = 0; } break; case 'ArrowRight': case 'd': case 'D': e.preventDefault(); if (dx !== -1) { nextDx = 1; nextDy = 0; } break; case ' ': e.preventDefault(); isPaused = !isPaused; break; }
        });

        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX, touchEndY = e.changedTouches[0].clientY;
            const dxx = touchEndX - touchStartX, dyy = touchEndY - touchStartY;
            if (Math.abs(dxx) > Math.abs(dyy)) { if (dxx > 0) setDirection(1, 0); else setDirection(-1, 0); }
            else { if (dyy > 0) setDirection(0, 1); else setDirection(0, -1); }
        }, { passive: true });

        init();
        requestAnimationFrame(render);
    </script>
</body>
</html>
